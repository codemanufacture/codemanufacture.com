<script type="application/ld+json">
  {{ $site := dict
    "@context" "https://schema.org"
    "@type" "WebSite"
    "name" .Site.Title
    "url" .Site.BaseURL
    "description" .Site.Params.description
    "inLanguage" "en-GB"
  }}

  {{- $site | jsonify (dict "indent" "  ") | safeJS -}}
</script>
