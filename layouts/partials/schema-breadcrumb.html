{{- if not .IsHome -}}
<script type="application/ld+json">
  {{ $items := slice (dict "@type" "ListItem" "position" 1 "name" "Home" "item" .Site.BaseURL) }}

  {{- with .Parent -}}
    {{- if ne .RelPermalink "/" -}}
      {{- $items = $items | append (dict "@type" "ListItem" "position" 2 "name" .Title "item" .Permalink) -}}
    {{- end -}}
  {{- end -}}
  {{- $items = $items | append (dict "@type" "ListItem" "position" (add (len $items) 1) "name" .Title "item" .Permalink) -}}

  {{- $breadcrumbs := dict "@context" "https://schema.org" "@type" "BreadcrumbList" "itemListElement" $items -}}
  {{- $breadcrumbs | jsonify (dict "indent" "  ") | safeJS -}}
</script>
{{- end -}}
